<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>巫師火元素特訓：巨龍逆襲戰 (fire-defence5)</title>
    <!-- 引入 tracking.js 核心與臉部追蹤模型 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/face-min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden; font-family: 'Microsoft JhengHei', sans-serif;
        }
        #container {
            position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        video, canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); /* 鏡像翻轉讓操作更直覺 */
        }
        canvas { z-index: 10; }
        
        /* 遊戲 UI 面板 */
        #ui-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px; background: rgba(20, 20, 20, 0.85);
            border: 2px solid #ff4500; border-radius: 15px; padding: 20px;
            color: #ddd; z-index: 20; box-shadow: 0 0 15px rgba(255, 69, 0, 0.5);
            text-align: left;
        }
        h2 { color: #ff4500; text-align: center; margin-top: 0; font-size: 1.2rem; }
        ul { padding-left: 20px; font-size: 0.9rem; line-height: 1.6; }
        li span.highlight { color: #ffd700; font-weight: bold; }
        .start-text { color: #00ffff; text-align: center; font-weight: bold; margin-top: 15px; font-size: 0.9rem; }
        
        /* 虛擬 START 按鈕 (可點擊或用魔杖觸碰) */
        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 100px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,255,255,0.2) 0%, rgba(0,150,200,0.8) 100%);
            border: 3px solid #00ffff; color: #fff; font-size: 1.2rem; font-weight: bold;
            display: flex; justify-content: center; align-items: center; z-index: 30;
            box-shadow: 0 0 20px #00ffff; cursor: pointer; text-shadow: 0 0 5px #000;
        }
        
        #hud {
            position: absolute; top: 20px; left: 20px; z-index: 20; color: white; font-size: 1.5rem; font-weight: bold; text-shadow: 2px 2px 4px #000; display: none;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="game-canvas"></canvas>
    
    <div id="ui-panel">
        <h2>巫師火元素特訓：巨龍逆襲戰</h2>
        <ul>
            <li><span class="highlight">火球攔截：</span>手持冰藍色 LED 魔杖擊落火球。</li>
            <li><span class="highlight">帽體閃避：</span>擺動身體控制巫師帽進行閃避。</li>
            <li><span class="highlight">生命界限：</span>火球落地或觸碰帽體會損失 1 頂巫師帽，滿 5 次則特訓結束。</li>
        </ul>
        <div class="start-text">—— 使用魔法棒點擊下方 START 鍵即開始遊戲 ——</div>
    </div>
    
    <div id="start-btn">START</div>
    <div id="hud">生命值: 🧙‍♂️🧙‍♂️🧙‍♂️🧙‍♂️🧙‍♂️ <br> 分數: <span id="score">0</span></div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const uiPanel = document.getElementById('ui-panel');
    const startBtn = document.getElementById('start-btn');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    // 遊戲狀態
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let lives = 5;
    let score = 0;
    let fireballs = [];
    
    // 實體位置
    let wandX = -100, wandY = -100;
    let hatX = canvas.width / 2, hatY = canvas.height / 2;

    // 自適應 Canvas 大小
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ==========================================
    // 1. 核心參數調整：註冊「冰藍色 LED」過濾器
    // ==========================================
    tracking.ColorTracker.registerColor('iceBlueLED', function(r, g, b) {
        // RGB 轉 HSV
        let max = Math.max(r, g, b), min = Math.min(r, g, b);
        let v = max / 255.0; 
        let s = max === 0 ? 0 : (max - min) / max;
        let h = 0;
        if (max !== min) {
            let d = max - min;
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (max === g) h = (b - r) / d + 2;
            else if (max === b) h = (r - g) / d + 4;
            h /= 6;
        }
        let hue = h * 360;

        // 參數條件：
        // 1. 色相(Hue): 170-230 (青色到淺藍)
        // 2. 亮度(Value): > 0.85 (必須是發光體，極亮)
        // 3. 飽和度(Saturation): < 0.65 (中心趨近於白光)
        if (hue >= 170 && hue <= 230 && v >= 0.85 && s <= 0.65) {
            return true;
        }
        return false;
    });

    // 初始化追蹤器
    const colorTracker = new tracking.ColorTracker(['iceBlueLED']);
    const faceTracker = new tracking.ObjectTracker('face');
    
    // 追蹤魔杖 (LED)
    colorTracker.on('track', function(event) {
        if (event.data.length === 0) return;
        // 找出最大的色塊當作魔杖
        let maxRect = event.data.reduce((prev, current) => (prev.width * prev.height > current.width * current.height) ? prev : current);
        
        // 座標轉換 (因為 video 有 scaleX(-1) 鏡像)
        let scaleX = canvas.width / video.videoWidth;
        let scaleY = canvas.height / video.videoHeight;
        // 反轉 X 座標
        wandX = canvas.width - (maxRect.x + maxRect.width / 2) * scaleX;
        wandY = (maxRect.y + maxRect.height / 2) * scaleY;

        // 在 START 狀態下，用魔杖觸碰 START 按鈕
        if (gameState === 'START') {
            let btnRect = startBtn.getBoundingClientRect();
            if (wandX > btnRect.left && wandX < btnRect.right && wandY > btnRect.top && wandY < btnRect.bottom) {
                startGame();
            }
        }
    });

    // 追蹤臉部 (帽子)
    faceTracker.setInitialScale(4);
    faceTracker.setStepSize(2);
    faceTracker.setEdgesDensity(0.1);
    faceTracker.on('track', function(event) {
        if (event.data.length === 0) return;
        let face = event.data[0];
        let scaleX = canvas.width / video.videoWidth;
        let scaleY = canvas.height / video.videoHeight;
        
        // 頭部中心點上方放帽子
        hatX = canvas.width - (face.x + face.width / 2) * scaleX;
        hatY = (face.y) * scaleY - 50; // 臉部上方
    });

    // 啟動攝影機與追蹤
    navigator.mediaDevices.getUserMedia({ video: true }).then(function(stream) {
        video.srcObject = stream;
        // 等待影片載入完畢後開始追蹤
        video.onloadedmetadata = () => {
            tracking.track('#video', colorTracker);
            tracking.track('#video', faceTracker);
        };
    }).catch(err => alert("請允許相機權限以進行遊戲！"));


    // ==========================================
    // 2. 遊戲邏輯與繪圖循環
    // ==========================================
    startBtn.addEventListener('click', startGame);

    function startGame() {
        if (gameState === 'PLAYING') return;
        gameState = 'PLAYING';
        uiPanel.style.display = 'none';
        startBtn.style.display = 'none';
        hud.style.display = 'block';
        lives = 5;
        score = 0;
        fireballs = [];
        updateHUD();
    }

    function loseLife() {
        lives--;
        updateHUD();
        // 畫面閃紅光特效
        ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        if (lives <= 0) {
            gameState = 'GAMEOVER';
            setTimeout(() => {
                alert(`特訓結束！你的分數是: ${score}\n點擊確定重新開始。`);
                gameState = 'START';
                uiPanel.style.display = 'block';
                startBtn.style.display = 'flex';
                hud.style.display = 'none';
            }, 100);
        }
    }

    function updateHUD() {
        let lifeStr = '';
        for(let i=0; i<lives; i++) lifeStr += '🧙‍♂️';
        hud.innerHTML = `生命值: ${lifeStr} <br> 分數: <span id="score">${score}</span>`;
    }

    function spawnFireball() {
        if (gameState !== 'PLAYING') return;
        fireballs.push({
            x: Math.random() * (canvas.width - 100) + 50,
            y: -50,
            speed: 3 + Math.random() * 4, // 速度
            radius: 25
        });
    }
    // 每 1.5 秒生成一顆火球
    setInterval(spawnFireball, 1500);

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === 'PLAYING') {
            // 1. 繪製並更新火球
            for (let i = fireballs.length - 1; i >= 0; i--) {
                let fb = fireballs[i];
                fb.y += fb.speed;

                // 畫火球
                ctx.beginPath();
                ctx.arc(fb.x, fb.y, fb.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff4500';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff8c00';
                ctx.fill();
                ctx.shadowBlur = 0; // 重置

                // 碰撞偵測：魔杖擊落火球 (距離小於 40)
                let distWand = Math.hypot(fb.x - wandX, fb.y - wandY);
                if (distWand < fb.radius + 20) {
                    fireballs.splice(i, 1);
                    score += 10;
                    updateHUD();
                    continue;
                }

                // 碰撞偵測：火球砸到帽子 (距離小於 40)
                let distHat = Math.hypot(fb.x - hatX, fb.y - hatY);
                if (distHat < fb.radius + 30) {
                    fireballs.splice(i, 1);
                    loseLife();
                    continue;
                }

                // 碰撞偵測：火球落地
                if (fb.y > canvas.height + fb.radius) {
                    fireballs.splice(i, 1);
                    loseLife();
                }
            }
        }

        // 2. 繪製帽子位置指示 (用 Emoji 代替圖檔，方便執行)
        ctx.font = "60px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("🧙‍♂️", hatX, hatY);

        // 3. 繪製魔杖追蹤光點 (回饋感)
        ctx.beginPath();
        ctx.arc(wandX, wandY, 15, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 255, 255, 0.6)';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ffff';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
        ctx.shadowBlur = 0;

        requestAnimationFrame(draw);
    }
    
    // 啟動繪圖迴圈
    draw();
</script>
</body>
</html>
